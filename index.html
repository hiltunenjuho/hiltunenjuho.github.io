<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juho M. Hiltunen</title>
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="icon" href="assets/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="manifest" href="assets/images/site.webmanifest">
    <link rel="stylesheet" href="styles/index.css">
    <link href='https://fonts.googleapis.com/css?family=Euphoria Script' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header id="mainHeader">
            <img id="logo" src="assets\images\logo_transparent_corners.png" alt="">
            <div id="headerTabsetContainer">
                <nav class="tabset" id="headerTabset" aria-label="Main navigation">
                    <button class="tabButton active" id="homeTabButton" data-page="homeContent" type="button">
                        home
                    </button>
                    <button class="tabButton" id="aboutTabButton" data-page="aboutContent" type="button">
                        about
                    </button>
                    <button class="tabButton" id="projectsTabButton" data-page="projectsContent" type="button">
                        projects
                    </button>
                    <button class="tabButton" id="contactTabButton" data-page="contactContent" type="button">
                        contact
                    </button>
                </nav>
            </div>
    </header>
    <main class="production">
        <div id="pageStage">
            <section class="pageContent active" id="homeContent">
            </section>
            <section class="pageContent" id="aboutContent">
                <div id="aboutContainer">
                    <h2 id="aboutHeader">
                        <span class="yellowText">for me</span>,
                    </h2>
                    <p id="aboutP">
                        <span class="purpleText">software development</span> is a mix of problem-solving, creativity and <span class="yellowText">continuous learning</span>.<br>
                        <br>
                        whether i'm <span class="purpleText">developing</span> a web app, <span class="purpleText">exploring</span> a new technology or <span class="purpleText">improving</span> an existing product,<br>
                        <br>
                        i enjoy the whole process of turning <span class="yellowText">ideas</span> into working <span class="yellowText">solutions</span>.
                    </p>
                </div>
            </section>
            <section class="pageContent" id="projectsContent">
            </section>
            <section class="pageContent" id="contactContent">
            </section>
        </div>
        <div class="heroOuterContainer" id="heroElement">
            <div class="heroInnerContainer" id="heroContainer">
                <h1 class="namePart" id="firstName">
                    JUHO 
                    <span id="middleName">
                        M.
                    </span>
                </h1>
                <h1 class="namePart" id="lastName">
                    HILTUNEN
                </h1>
                <div id="heroSubText">
                    <span class="typedText" id="typedText">// i <span id="purpleTypedText" onclick="document.getElementById(`projectsTabButton`).click(); return false;">build</span> <span id="yellowTypedText">software</span>.</span>
                    <span class="cursor"></span>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div id="footerMain">
            <div id="footerLeft"></div>
            <div id="footerRight"></div>
        </div>
    </footer>
</body>
</html>
